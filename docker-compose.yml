version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: project-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - project-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: project-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - project-network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app_finem}
      POSTGRES_USER: ${DB_USERNAME:-app_finem_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Erichganteng160507!}
    ports:
      - "5432:5432"
    volumes:
      - project-db-data:/var/lib/postgresql/data
    networks:
      - project-network

  redis:
    image: redis:7-alpine
    container_name: project-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - project-redis-data:/data
    networks:
      - project-network

  # Worker khusus untuk proses queue Laravel (job async: email, notifikasi, dll)
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: project-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ./:/var/www
    networks:
      - project-network
    depends_on:
      - db
      - redis

networks:
  project-network:
    driver: bridge

volumes:
  project-db-data:
  project-redis-data:
